# NIRIKSHAK vendor pack — cisco ios
#
# P3 ships this as a DETECTION-ONLY pack: `detect` and `identity` are populated,
# `patterns` is empty. That is an honest state rather than a placeholder — the
# platform is recognised and device identity is read, while every canonical
# security field stays UNKNOWN because nothing here claims to parse one yet.
#
# P4 adds parsing patterns as a new pack version.
#
# Patterns use single-quoted YAML scalars: double quotes would process
# backslashes as escapes and mangle every regex.

vendor: cisco
os_family: ios
pack_version: 1.0.0
status: active
created_by: team-atlantis
checksum: sha256:3a3bc0394fa93fcb28f6b33e4412e9337ca764bce176f4720e8d565b0c9d0009

detect:
  - { type: regex, pattern: '^version \d+\.\d+', weight: 0.25 }
  - { type: regex, pattern: '^service timestamps ', weight: 0.25 }
  - { type: regex, pattern: '^line vty \d+', weight: 0.2 }
  - { type: regex, pattern: '^interface (GigabitEthernet|FastEthernet)\d', weight: 0.2 }
  - { type: regex, pattern: '^ip ssh version ', weight: 0.15 }

identity:
  - field: hostname
    match:   { type: regex, pattern: '^hostname (\S+)' }
    capture: { value: '$1', cast: str }
    examples: ['hostname rtr-core-01']
  - field: os_version
    match:   { type: regex, pattern: '^version (\S+)' }
    capture: { value: '$1', cast: str }
    examples: ['version 17.9']
  - field: model
    match:   { type: regex, pattern: '^! model (\S+)' }
    capture: { value: '$1', cast: str }
    examples: ['! model ISR4331']

patterns: []
