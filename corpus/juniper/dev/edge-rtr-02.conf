# NIRIKSHAK sample corpus -- seed_examples/juniper_junos_set/edge-rtr-02.conf
#
# Vendor      : Juniper
# OS family   : JunOS, flat 'set' hierarchy
# Provenance  : Command syntax adapted from Juniper's JunOS CLI User Guide,
#               the SNMPv3 USM/VACM configuration reference, and publicly
#               documented 'set'-style configuration examples. Hostname,
#               addressing and device identity below are synthetic.
#               See corpus/PROVENANCE.md.
# Intent      : A WELL-hardened device -- most canonical checks here should
#               PASS. Exercises the flat 'set <path> <value>' parsing path
#               of the parser (ADR 0004), as distinct from the brace-nested
#               file elsewhere in this corpus for the same vendor.
# Absence note: this file never issues 'set system services telnet' or
#               'set system services web-management http'. On JunOS, system
#               services are opt-in and disabled unless explicitly
#               configured, so that absence is a confident PASS here -- a
#               genuinely different default from Cisco IOS, where an absent
#               'ip http server' line does NOT mean the service is off. This
#               pairing is deliberate: it is the concrete case for the
#               per-OS capability/default modelling that CLAUDE.md S7
#               (absence-aware evaluation) calls for.
# Secrets     : The encrypted-password, ssh key, and SNMPv3 passphrase
#               values below are fabricated placeholders invented for this
#               corpus. None are real.
# Syntax note: a real Junos 'set' export has no comment syntax of its own.
#               These leading '#' lines are corpus documentation only, and
#               are expected to surface as unparsed/unplaced lines under
#               ADR 0004's "Total" invariant, not as configuration.
#
set version 21.4R3.15
set system host-name edge-rtr-02
set system domain-name corp.example.net
set system root-authentication encrypted-password "$6$SAMPLE$PlaceholderRootHashNotReal5566"
set system services ssh root-login deny
set system services ssh connection-limit 4
set system services netconf ssh
set system services web-management https interface fxp0.0
set system login message "Authorised use only. All activity is logged and monitored.\n"
set system login user netadmin uid 2001
set system login user netadmin class super-user
set system login user netadmin authentication ssh-rsa "ssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAABAQCSamplePlaceholderKeyNotARealPublicKeyXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX== nirikshak-corpus-sample"
set system syslog host 198.51.100.40 any notice
set system syslog host 198.51.100.40 authorization info
set system syslog host 198.51.100.40 port 514
set system syslog file messages any notice
set system ntp server 192.0.2.10
set system ntp server 192.0.2.11
set snmp location "DC-EDGE / Row 9 / Rack 2"
set snmp contact "netops@example.net"
set snmp v3 usm local-engine user netmon authentication-sha authentication-password "NIRIKSHAK-SAMPLE-AUTHKEY"
set snmp v3 usm local-engine user netmon privacy-aes128 privacy-password "NIRIKSHAK-SAMPLE-PRIVKEY"
set snmp v3 vacm security-to-group security-model usm security-name netmon group NIRIKSHAK-RO-GROUP
set snmp v3 vacm access group NIRIKSHAK-RO-GROUP default-context-prefix security-model usm security-level privacy read-view all-view
set snmp view all-view oid .1 include
set interfaces ge-0/0/0 unit 0 description "TO-ISP-A"
set interfaces ge-0/0/0 unit 0 family inet address 203.0.113.6/30
set interfaces ge-0/0/1 unit 0 description "TO-CORE-RTR-01"
set interfaces ge-0/0/1 unit 0 family inet address 10.30.1.2/30
set interfaces fxp0 unit 0 description "OUT-OF-BAND-MGMT"
set interfaces fxp0 unit 0 family inet address 198.51.100.14/24
set interfaces lo0 unit 0 family inet address 203.0.113.7/32
set interfaces lo0 unit 0 family inet filter input PROTECT-RE
set policy-options prefix-list TRUSTED-MGMT 198.51.100.0/24
set firewall family inet filter PROTECT-RE term allow-mgmt-ssh from source-prefix-list TRUSTED-MGMT
set firewall family inet filter PROTECT-RE term allow-mgmt-ssh from protocol tcp
set firewall family inet filter PROTECT-RE term allow-mgmt-ssh from destination-port ssh
set firewall family inet filter PROTECT-RE term allow-mgmt-ssh then accept
set firewall family inet filter PROTECT-RE term allow-mgmt-https from source-prefix-list TRUSTED-MGMT
set firewall family inet filter PROTECT-RE term allow-mgmt-https from protocol tcp
set firewall family inet filter PROTECT-RE term allow-mgmt-https from destination-port https
set firewall family inet filter PROTECT-RE term allow-mgmt-https then accept
set firewall family inet filter PROTECT-RE term allow-mgmt-https-dup from source-prefix-list TRUSTED-MGMT
set firewall family inet filter PROTECT-RE term allow-mgmt-https-dup from protocol tcp
set firewall family inet filter PROTECT-RE term allow-mgmt-https-dup from destination-port https
set firewall family inet filter PROTECT-RE term allow-mgmt-https-dup then accept
set firewall family inet filter PROTECT-RE term log-and-deny then log
set firewall family inet filter PROTECT-RE term log-and-deny then syslog
set firewall family inet filter PROTECT-RE term log-and-deny then discard
