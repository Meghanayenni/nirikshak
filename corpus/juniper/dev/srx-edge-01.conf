set version 21.4R3
set system host-name srx-edge-01
set system domain-name lab.example
set system services ssh protocol-version v2
set system services ssh root-login deny
set system syslog host 192.0.2.10 any notice
set system ntp server 192.0.2.20
set interfaces ge-0/0/0 unit 0 family inet address 192.0.2.129/30
set interfaces ge-0/0/1 unit 0 family inet address 198.51.100.129/25
set security zones security-zone trust interfaces ge-0/0/1.0
set security policies from-zone trust to-zone untrust policy allow-web match source-address any
