/*
 * NIRIKSHAK sample corpus -- seed_examples/juniper_junos_curly/core-rtr-01.conf
 *
 * Vendor      : Juniper
 * OS family   : JunOS, brace-nested hierarchy
 * Provenance  : Command syntax adapted from Juniper's own JunOS CLI User
 *               Guide, the routing-policy firewall-filter examples in
 *               Juniper's documentation, and publicly documented sample
 *               configurations. Hostname, addressing and device identity
 *               below are synthetic. See corpus/PROVENANCE.md.
 * Intent      : An UNDER-hardened device -- Telnet and plaintext HTTP
 *               management are both still enabled, SSH root-login is left
 *               at its platform default (not explicitly denied), and SNMP
 *               is community-based only. Exercises the curly-brace
 *               block-nesting path of the parser (ADR 0004), and pairs
 *               with juniper_junos_set/edge-rtr-02.conf to test that the
 *               same vendor's two syntax dialects both parse correctly.
 * Filter      : PROTECT-RE is deliberately wrong, and in two ways. Its
 *               `allow-all-tcp` term permits every TCP session rather
 *               than only established ones, and `allow-anything` sits
 *               above the terms meant to block telnet and to deny by
 *               default -- so neither can ever take effect. Both are
 *               fixtures for the P7 interval analyser, not oversights.
 * Correction  : that first term was named `allow-established` until P18.
 *               The analyser reported the two management permits below it
 *               as redundant, which is only true of a term matching ALL
 *               TCP -- and the name said otherwise. The name was the
 *               error; the configuration was always what it appears to
 *               be. Renamed rather than given a state match, because
 *               writing the JunOS keyword for one would be vendor syntax
 *               this repository cannot source. See ADR 0050.
 * Secrets     : The encrypted-password values below are fabricated
 *               placeholders invented for this corpus. None are real.
 */
version 21.4R3.15;
system {
    host-name core-rtr-01;
    domain-name corp.example.net;
    time-zone UTC;
    root-authentication {
        encrypted-password "$6$SAMPLE$PlaceholderRootHashNotARealSecretXYZ0011"; ## SECRET-DATA
    }
    login {
        message "Authorised use only. All activity is logged and monitored.\n";
        user netadmin {
            full-name "Network Admin";
            uid 2001;
            class super-user;
            authentication {
                encrypted-password "$6$SAMPLE$PlaceholderAdminHashNotReal2233"; ## SECRET-DATA
            }
        }
        user netmon {
            full-name "Read-Only Monitoring";
            uid 2002;
            class read-only;
            authentication {
                encrypted-password "$6$SAMPLE$PlaceholderMonHashNotReal4455"; ## SECRET-DATA
            }
        }
    }
    services {
        ftp;
        ssh {
            connection-limit 4;
        }
        telnet;
        web-management {
            http {
                interface [ fxp0.0 ];
            }
        }
        netconf {
            ssh;
        }
    }
    syslog {
        host 198.51.100.40 {
            any notice;
            authorization info;
        }
        file messages {
            any any;
            authorization info;
        }
        file interactive-commands {
            interactive-commands any;
        }
    }
    ntp {
        server 192.0.2.10;
        server 192.0.2.11;
    }
}
interfaces {
    ge-0/0/0 {
        unit 0 {
            description "TO-CORE-RTR-02";
            family inet {
                address 10.30.1.1/30;
            }
        }
    }
    ge-0/0/1 {
        unit 0 {
            description "TO-DIST-SW-01";
            family inet {
                address 10.30.2.1/30;
            }
        }
    }
    fxp0 {
        unit 0 {
            description "OUT-OF-BAND-MGMT";
            family inet {
                address 198.51.100.13/24;
            }
        }
    }
    lo0 {
        unit 0 {
            family inet {
                filter {
                    input PROTECT-RE;
                }
                address 203.0.113.5/32;
            }
        }
    }
}
snmp {
    description "core-rtr-01";
    location "DC1 / Core Row / Rack 3";
    contact "netops@example.net";
    community public {
        authorization read-only;
    }
}
firewall {
    family inet {
        filter PROTECT-RE {
            term allow-all-tcp {
                from {
                    protocol tcp;
                }
                then accept;
            }
            term allow-management {
                from {
                    source-address {
                        198.51.100.0/24;
                    }
                    protocol tcp;
                    destination-port [ ssh https ];
                }
                then accept;
            }
            term allow-anything {
                then accept;
            }
            term block-remote-telnet {
                from {
                    protocol tcp;
                    destination-port telnet;
                }
                then discard;
            }
            term default-deny {
                then {
                    log;
                    discard;
                }
            }
        }
    }
}
routing-options {
    router-id 203.0.113.5;
}
