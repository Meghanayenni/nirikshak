# NIRIKSHAK corpus manifest — decision R9
#
# Every file under corpus/ must appear here with a matching checksum, or
# tests/integration/test_corpus_policy.py fails. The manifest is what makes the
# train/evaluation separation mechanical rather than remembered.
#
# PROVENANCE HONESTY
# ------------------
# Every configuration here is SYNTHETIC: written by the team to be realistic,
# not captured from a real network. No file in this corpus is real-world
# configuration data and none may be represented as such. The P9 evaluation
# report must state this, and must not claim universal vendor coverage on the
# strength of eleven hand-written files.
#
# SPLITS
# ------
#   dev      configurations vendor packs are authored from
#   eval     hand-labelled; NEVER opened while authoring patterns
#   holdout  PAN-OS — no pack, no seed example, no development label, until the
#            generalisation experiment at P9/P10
#
# SANITISATION
# ------------
# RFC 5737 (192.0.2.0/24, 198.51.100.0/24) and RFC 1918 addressing only.
# Invented hostnames under the reserved .example domain. No credentials in any
# form — including hashed ones, since a type-7 or MD5 hash is crackable and a
# file containing one is not sanitised.

