! Command: show running-config
! device: dc1-spine-01 (vEOS, EOS-4.31.2F)
!
! NIRIKSHAK sample corpus -- seed_examples/arista_eos/dc1-spine-01.cfg
! Vendor      : Arista
! OS family   : EOS (indent-based hierarchy; Cisco-like AAA/SNMP/logging
!               syntax, but dedicated "management ssh/telnet/console" blocks
!               for connection management, unlike classic IOS "line vty").
! Provenance  : Command syntax adapted from Arista's EOS User Manual
!               (Connection Management, Session Management, eAPI chapters)
!               and community references. Hostname, addressing and device
!               identity below are synthetic. See corpus/PROVENANCE.md.
! Intent      : A MIXED-posture device -- some canonical checks PASS (SSH
!               hardening, NTP, banner, AAA), others FAIL (Telnet explicitly
!               re-enabled even though EOS disables it by default; SNMPv2c
!               community still present alongside no SNMPv3 configured at
!               all). Exercises per-field reporting rather than a single
!               pass/fail verdict per device.
! Secrets     : All hash-shaped and key-shaped values below are fabricated
!               placeholders invented for this corpus. None are real.
!
hostname dc1-spine-01
!
username netadmin privilege 15 role network-admin secret sha512 $6$SAMPLE$PlaceholderAdminHashNotReal00112233445566778899
username netmon privilege 1 role network-operator secret sha512 $6$SAMPLE$PlaceholderMonHashNotReal99887766554433221100
!
radius-server host 198.51.100.25 key 0 NIRIKSHAK-SAMPLE-RADIUS-KEY-NOT-REAL
aaa group server radius CORP-RADIUS
   server 198.51.100.25
aaa authentication login default group CORP-RADIUS local
aaa authorization exec default group CORP-RADIUS local
!
management console
   idle-timeout 15
!
management ssh
   idle-timeout 15
   no shutdown
!
management telnet
   idle-timeout 0
   no shutdown
!
management api http-commands
   protocol https port 443
   no shutdown
   vrf MGMT
      no shutdown
!
snmp-server community public ro
snmp-server community public rw
snmp-server location DC1-SPINE-ROW1
snmp-server contact netops@example.net
!
logging host 198.51.100.40
logging source-interface Loopback0
logging trap informational
!
ntp server 192.0.2.10 local-interface Management1
ntp server 192.0.2.11 local-interface Management1
!
banner motd
Authorised use only.
All sessions are logged and monitored.
EOF
!
vrf instance MGMT
!
interface Management1
   vrf MGMT
   ip address 198.51.100.12/24
   ip access-group MGMT-IN in
!
interface Loopback0
   ip address 203.0.113.1/32
!
interface Ethernet1
   description TO-LEAF1A
   no switchport
   ip address 10.20.1.0/31
   no shutdown
!
interface Ethernet2
   description TO-LEAF1B
   no switchport
   ip address 10.20.1.2/31
   no shutdown
!
ip access-list MGMT-IN
   10 permit tcp 198.51.100.0/24 any eq 22
   20 permit tcp 198.51.100.0/24 any eq 443
   30 permit udp 198.51.100.0/24 any eq snmp
   40 permit ip any any
   50 deny tcp host 203.0.113.9 any eq 22 log
!
end
