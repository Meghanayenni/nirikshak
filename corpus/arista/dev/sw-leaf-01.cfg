! device: sw-leaf-01 (DCS-7050SX3-48YC8, EOS-4.29.2F)
!
transceiver qsfp default-mode 4x10G
!
hostname sw-leaf-01
!
management api http-commands
   no shutdown
!
logging host 192.0.2.10
ntp server 192.0.2.20
!
interface Ethernet1
   description leaf-to-spine
   no switchport
   ip address 192.0.2.65/31
!
interface Ethernet2
   switchport access vlan 30
!
line vty 0 4
   exec-timeout 15 0
!
end
