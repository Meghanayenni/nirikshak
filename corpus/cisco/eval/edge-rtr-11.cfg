! =============================================================================
! NIRIKSHAK sample corpus -- seed_examples/cisco_ios/edge-rtr-11.cfg
!
! Vendor / OS : Cisco IOS (indent mode)
! Intent      : REGRESSION TEST for the patterns confirmed against
!               edge-rtr-01. Deliberately boring.
!
! Every command SHAPE here already appeared in edge-rtr-01. Only the VALUES
! differ -- different hostname, different IPs, different SNMP location,
! different timeout numbers, different cipher list. Nothing structurally new.
!
! The success criterion is a number, and it is the point of the whole file:
!
!     Needs Review on this device should be close to ZERO.
!
! If it comes back near 48 again, the patterns you confirmed are matching the
! exact literal lines from edge-rtr-01 instead of the shape -- meaning your
! pack memorised one device rather than learning IOS, and the whole
! train-once-reuse-everywhere claim does not hold. That is the single
! cheapest way to check whether the training loop actually works, and it is
! worth running before you show this to anyone.
!
! Two intentional value-level differences to watch:
!   - 'ip ssh version 2' here vs version 1 on edge-rtr-01. Same pattern,
!     opposite verdict. Confirms the pattern captures the number rather than
!     just firing on the command.
!   - 'exec-timeout 15 0' here vs 60 0 on edge-rtr-01. Tests the
!     minutes-vs-seconds question you flagged during review: if this reports
!     15 SECONDS rather than 15 minutes, the captured token is being read in
!     the wrong unit, and a 15-minute timeout would wrongly PASS a
!     900-second threshold.
!
! Secrets     : All hash-shaped values are fabricated placeholders. Not real.
! =============================================================================
!
version 15.2
service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption
!
hostname edge-rtr-11
!
boot-start-marker
boot-end-marker
!
enable secret 9 $9$SAMPLE$PlaceholderEnableHashEdge11NotARealSecret223344
!
aaa new-model
aaa authentication login default local
aaa authorization exec default local
!
ip domain-name dr.example.net
!
username netadmin privilege 15 secret 9 $9$SAMPLE$PlaceholderUserHashEdge11NotReal556677
!
ip ssh version 2
ip ssh time-out 90
ip ssh authentication-retries 3
ip ssh server algorithm encryption aes128-cbc
ip ssh server algorithm mac hmac-sha1
!
ip http server
ip http secure-server
!
no logging console
logging buffered 8192
logging host 192.0.2.60
logging trap informational
!
ntp server 192.0.2.20
ntp server 192.0.2.21
!
snmp-server community public RO
snmp-server location DR-SITE-ROW1-RACK03
snmp-server contact netops@example.net
!
banner motd ^C
******************************************************************
  Authorised access only. All activity may be monitored and logged.
******************************************************************
^C
!
interface GigabitEthernet0/0
 description WAN-UPLINK-TO-ISP-B
 ip address 203.0.113.50 255.255.255.252
 no shutdown
!
interface GigabitEthernet0/1
 description DR-LAN
 ip address 10.55.0.1 255.255.255.0
 no shutdown
!
interface Loopback0
 description MGMT-LOOPBACK
 ip address 198.51.100.9 255.255.255.255
!
ip access-list extended DR-EDGE-IN
 remark permit established return traffic
 permit tcp any any established
 remark catch-all -- makes every rule below it irrelevant
 permit ip any any
 deny   ip any any log
!
line con 0
 exec-timeout 0 0
 logging synchronous
line vty 0 4
 exec-timeout 15 0
 transport input telnet ssh
 login authentication default
line vty 5 15
 exec-timeout 15 0
 transport input telnet ssh
 login authentication default
!
end
