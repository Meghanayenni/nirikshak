version 15.2
service timestamps log datetime msec
service password-encryption
!
! model WS-C3850-24T
hostname sw-dist-11
!
ip domain name campus.example
no ip domain lookup
!
ip ssh version 1
ip http server
!
logging host 192.0.2.13
logging trap warnings
!
ntp server 192.0.2.23
!
interface GigabitEthernet1/0/1
 description access-stack-a
 switchport mode trunk
!
interface Vlan30
 description user-vlan-30
 ip address 198.51.100.30 255.255.255.0
!
line con 0
 exec-timeout 15 0
line vty 0 15
 transport input telnet ssh
 exec-timeout 30 0
!
end
