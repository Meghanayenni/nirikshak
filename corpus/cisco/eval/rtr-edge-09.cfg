version 17.6
service timestamps debug datetime msec
service password-encryption
!
! model ISR4451
hostname rtr-edge-09
!
ip ssh version 2
no ip http server
no ip http secure-server
!
logging host 192.0.2.11
ntp server 192.0.2.22
!
interface GigabitEthernet0/0/0
 description transit
 ip address 192.0.2.33 255.255.255.252
!
line vty 0 4
 transport input ssh
 exec-timeout 5 0
!
end
