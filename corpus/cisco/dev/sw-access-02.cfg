version 15.2
service timestamps log datetime msec
!
! model WS-C2960X
hostname sw-access-02
!
no ip http server
!
logging host 192.0.2.10
ntp server 192.0.2.20
!
interface FastEthernet0/1
 switchport mode access
 switchport access vlan 20
!
line vty 0 15
 transport input telnet ssh
 exec-timeout 30 0
!
end
