! =============================================================================
! NIRIKSHAK sample corpus -- seed_examples/cisco_ios/edge-rtr-09.cfg
!
! Vendor / OS : Cisco IOS (indent mode)
! Intent      : ABSENCE-HEAVY. A barely-configured device. This file is
!               mostly about what is NOT in it.
!
! This is the file that tests your absence semantics -- the thing CLAUDE.md
! S7 calls for and that PROVENANCE.md already flagged as asymmetric across
! vendors. Every field below is MISSING, and each one should resolve
! differently. Getting these wrong is not a cosmetic bug: silently treating
! "absent" as "compliant" is how an auditor hands out a clean report on an
! insecure device.
!
!   - NO 'ip ssh version' line. On IOS the default depends on image and
!     release, so the honest answer is UNKNOWN, not PASS and not FAIL.
!     If your report shows a verdict here, the pack guessed.
!   - NO 'ip http server' AND no 'no ip http server'. Absent does NOT mean
!     off on IOS -- many platforms ship it ON. Correct answer: UNKNOWN.
!     Contrast this with JunOS, where an absent service genuinely is off.
!     Same absence, opposite meaning, which is the whole point.
!   - NO banner motd at all -> banner_present should be FALSE. This one
!     absence IS decidable, because a banner only exists if configured.
!   - NO 'ntp server' lines -> ntp_servers empty. Decidable, FAIL.
!   - NO 'logging host' -> no remote log destination. Decidable, FAIL.
!   - NO 'aaa new-model' -> AAA off. Decidable, FAIL.
!   - NO 'security passwords min-length'. Policy unset -> UNKNOWN or FAIL,
!     but you must decide WHICH and be able to say why.
!
! So: three fields should come back UNKNOWN, four should come back FAIL.
! If everything comes back FAIL, the pack is treating absence as failure
! uniformly and the UNKNOWN state is not real. If anything comes back PASS,
! something is very wrong.
!
! Also note 'enable password 0' -- a plaintext password, worse than the
! 'enable secret' on the other files. No current field covers it, same gap
! as 'no service password-encryption' on edge-rtr-01.
!
! Secrets     : The password value is a fabricated placeholder. Not real.
! =============================================================================
!
version 15.1
!
hostname edge-rtr-09
!
boot-start-marker
boot-end-marker
!
enable password 0 NirikshakSamplePlaintextNotReal
!
username operator privilege 15 password 0 NirikshakSampleUserPlaintextNotReal
!
interface GigabitEthernet0/0
 description WAN-UPLINK
 ip address 203.0.113.34 255.255.255.252
 no shutdown
!
interface GigabitEthernet0/1
 description SITE-LAN
 ip address 10.90.1.1 255.255.255.0
 no shutdown
!
line con 0
 exec-timeout 0 0
line vty 0 4
 exec-timeout 0 0
 transport input telnet
 login
!
end
