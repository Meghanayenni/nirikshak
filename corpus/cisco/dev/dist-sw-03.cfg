! =============================================================================
! NIRIKSHAK sample corpus -- seed_examples/cisco_ios/dist-sw-03.cfg
!
! Vendor / OS : Cisco IOS (indent mode) -- Catalyst switch, not a router
! Intent      : MIXED posture. Built almost entirely out of cases where one
!               device gives CONFLICTING evidence for a single field.
!
! What this file is built to test:
!   1. SPLIT VTY RANGES, CONFLICTING VERDICTS. 'line vty 0 4' has
!      'transport input ssh' (good). 'line vty 5 15' has
!      'transport input telnet ssh' (bad). Same field, same device, two
!      answers. A device is only as secure as its weakest line, so
!      telnet_enabled must resolve to TRUE here. If the pack takes
!      first-match or last-match instead of worst-case, it will get this
!      wrong -- and that is a false PASS, the failure mode that matters most.
!   2. exec-timeout 0 0 ON A VTY LINE (DEF-8). On edge-rtr-01 this only
!      appeared on the console. Here it is on 'line vty 0 4', where it means
!      a REMOTE session that never expires. 0 is not a strict timeout, it is
!      no timeout. If the rule engine compares 0 against a threshold
!      numerically, it will report PASS on the worst possible setting.
!   3. SNMP v2c AND v3 TOGETHER. A v3 user is configured, but a read-only
!      v2c community was never removed. snmp_v3_only must be FALSE. This is
!      the two-sources-of-evidence merge problem directly.
!   4. http off but https on -- two separate fields that must not be merged.
!   5. NEW RESIDUE: switchport / vlan / spanning-tree lines your IOS pack has
!      never seen. Expect a fresh batch in Needs Review. All are
!      'not security relevant'.
!
! Secrets     : All hash-shaped and key-shaped values are fabricated
!               placeholders. None are real or working.
! =============================================================================
!
version 15.2
service timestamps debug datetime msec
service timestamps log datetime msec
service password-encryption
!
hostname dist-sw-03
!
boot-start-marker
boot-end-marker
!
enable secret 9 $9$SAMPLE$PlaceholderEnableHashDistSw03NotReal667788
!
aaa new-model
aaa authentication login default local
aaa authorization exec default local
!
ip domain-name campus.example.net
!
username netadmin privilege 15 secret 9 $9$SAMPLE$PlaceholderUserHashDistSw03NotReal990011
!
ip ssh version 2
ip ssh time-out 120
ip ssh server algorithm encryption aes128-cbc 3des-cbc
!
no ip http server
ip http secure-server
!
spanning-tree mode rapid-pvst
spanning-tree extend system-id
!
vlan 10
 name USERS
vlan 20
 name VOICE
vlan 99
 name MGMT
!
no logging console
logging buffered 16384
logging host 198.51.100.40
logging trap warnings
!
ntp server 192.0.2.10
!
snmp-server community public RO
snmp-server view NETMON-VIEW iso included
snmp-server group NETMON-GROUP v3 priv read NETMON-VIEW
snmp-server user netmon NETMON-GROUP v3 auth sha NIRIKSHAK-SAMPLE-AUTHKEY priv aes 128 NIRIKSHAK-SAMPLE-PRIVKEY
snmp-server location CAMPUS-IDF-3
snmp-server contact netops@example.net
!
banner motd ^C
******************************************************************
  Authorised access only. All activity may be monitored and logged.
******************************************************************
^C
!
interface GigabitEthernet1/0/1
 description USER-ACCESS-PORT
 switchport mode access
 switchport access vlan 10
 spanning-tree portfast
 no shutdown
!
interface GigabitEthernet1/0/24
 description UPLINK-TO-CORE
 switchport mode trunk
 switchport trunk allowed vlan 10,20,99
 no shutdown
!
interface Vlan99
 description MGMT-SVI
 ip address 198.51.100.23 255.255.255.0
 no shutdown
!
line con 0
 exec-timeout 5 0
 logging synchronous
line vty 0 4
 exec-timeout 0 0
 transport input ssh
 login authentication default
line vty 5 15
 exec-timeout 30 0
 transport input telnet ssh
 login authentication default
!
end
