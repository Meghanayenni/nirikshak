!Command: show running-config
!NIRIKSHAK sample corpus -- seed_examples/cisco_nxos/dc1-leaf-01.cfg
!
!Vendor      : Cisco
!OS family   : NX-OS (indent-based hierarchy, feature-gated services)
!Provenance  : Command syntax adapted from Cisco NX-OS configuration guides,
!              the NX-API DME/CLI reference, and community configuration
!              examples. Hostname, addressing and device identity below are
!              synthetic. See corpus/PROVENANCE.md for the full source list.
!Intent      : A well-hardened device -- most canonical checks here should
!              PASS, giving the evaluation harness a true "good device"
!              fixture alongside the FAIL fixtures elsewhere in this corpus.
!Secrets     : All hash-shaped values below are fabricated placeholders
!              invented for this corpus. None are real or working.
!
version 9.3(6) Bios:version 05.33
hostname dc1-leaf-01

feature ssh
feature lacp
feature interface-vlan
no feature telnet

password strength-check

username netadmin password 5 $5$SAMPLE$PlaceholderAdminHashNotARealSecretOnly1122 role network-admin
username netmon password 5 $5$SAMPLE$PlaceholderMonHashNotARealSecretOnly3344 role network-operator

aaa group server tacacs+ CORP-TACACS
  server 198.51.100.20
  use-vrf management
  source-interface mgmt0
aaa authentication login default group CORP-TACACS local
aaa authentication login console local
aaa accounting default group CORP-TACACS

ssh key rsa 2048 force
ip ssh server algorithm authentication publickey password
ip ssh server algorithm encryption aes256-ctr aes192-ctr aes128-ctr
ip ssh server algorithm mac hmac-sha2-256

no ip http server
no ip http secure-server

snmp-server user netmon NETMON-GROUP v3 auth sha NIRIKSHAK-SAMPLE-AUTHKEY priv aes-128 NIRIKSHAK-SAMPLE-PRIVKEY
snmp-server group NETMON-GROUP v3 priv read NETMON-VIEW
snmp-server view NETMON-VIEW iso included
snmp-server host 198.51.100.30 use-vrf management version 3 priv netmon
snmp-server location DC1-ROW2-RACK08
snmp-server contact netops@example.net

logging server 198.51.100.40 6 use-vrf management
logging timestamp milliseconds
logging monitor 5

ntp server 192.0.2.10 use-vrf management
ntp server 192.0.2.11 use-vrf management

banner motd #
Authorised use only. Disconnect immediately if you are not an
authorised administrator of this system.
#

vrf context management
  ip route 0.0.0.0/0 198.51.100.1

line vty
  session-limit 4
  exec-timeout 10

line console
  exec-timeout 10

ip access-list MGMT-IN
  10 permit tcp 198.51.100.0/24 any eq 22
  20 permit tcp 198.51.100.0/24 any eq 443
  30 deny ip any any log

interface mgmt0
  vrf member management
  ip address 198.51.100.11/24
  ip access-group MGMT-IN in

interface Ethernet1/1
  description TO-SPINE1
  no switchport
  ip address 10.10.12.1/30
  no shutdown

interface Ethernet1/2
  description TO-SERVER-RACK-A
  switchport
  switchport mode trunk
  switchport trunk allowed vlan 100-110
  no shutdown
