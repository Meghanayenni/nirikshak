! =============================================================================
! NIRIKSHAK sample corpus -- seed_examples/cisco_ios/branch-rtr-07.cfg
!
! Vendor / OS : Cisco IOS (indent mode)
! Intent      : WELL-HARDENED. Most checks should PASS. Exists to catch
!               FALSE POSITIVES -- if this device reports FAIL on ssh_version,
!               telnet_enabled or http_server_enabled, the pack has a bug.
!
! What this file is built to test:
!   1. NEGATION TRAP. Contains 'no ip http server' and 'no ip http
!      secure-server'. The string "ip http server" appears INSIDE the negated
!      line. If the http_server_enabled pattern is not anchored to the start
!      of the line, it will match here and assert TRUE -- reporting HTTP as
!      enabled on a device that explicitly disabled it. That is a false FAIL
!      on a clean device. Check this one first.
!   2. min_password_length finally gets evidence. edge-rtr-01 had no
!      'security passwords min-length' line at all, so that field has never
!      been exercised. Here it is set to 12.
!   3. Strong ciphers on the same command shape that carried weak ones in
!      edge-rtr-01 -- confirms weak_ciphers distinguishes values rather than
!      just firing on the command's presence.
!   4. SNMPv3 configured with NO v1/v2c community anywhere -- the clean
!      counterpart to the snmp_v3_only problem you hit on edge-rtr-01.
!
! Secrets     : All hash-shaped and key-shaped values are fabricated
!               placeholders. None are real or working.
! =============================================================================
!
version 15.7
service timestamps debug datetime msec
service timestamps log datetime msec
service password-encryption
!
hostname branch-rtr-07
!
boot-start-marker
boot-end-marker
!
security passwords min-length 12
!
enable secret 9 $9$SAMPLE$PlaceholderEnableHashBranch07NotARealSecret001122
!
aaa new-model
aaa authentication login default local
aaa authorization exec default local
!
ip domain-name branch.example.net
!
username netadmin privilege 15 secret 9 $9$SAMPLE$PlaceholderUserHashBranch07NotReal334455
!
ip ssh version 2
ip ssh time-out 60
ip ssh authentication-retries 2
ip ssh server algorithm encryption aes256-ctr aes192-ctr aes128-ctr
ip ssh server algorithm mac hmac-sha2-256
!
no ip http server
no ip http secure-server
!
no logging console
logging buffered 32768
logging host 198.51.100.40
logging trap informational
!
ntp server 192.0.2.10
ntp server 192.0.2.11
!
snmp-server view NETMON-VIEW iso included
snmp-server group NETMON-GROUP v3 priv read NETMON-VIEW
snmp-server user netmon NETMON-GROUP v3 auth sha NIRIKSHAK-SAMPLE-AUTHKEY priv aes 128 NIRIKSHAK-SAMPLE-PRIVKEY
snmp-server location BR7-COMMS-CABINET
snmp-server contact netops@example.net
!
banner motd ^C
******************************************************************
  Authorised access only. All activity may be monitored and logged.
******************************************************************
^C
!
interface GigabitEthernet0/0
 description WAN-UPLINK-TO-MPLS
 ip address 203.0.113.18 255.255.255.252
 no shutdown
!
interface GigabitEthernet0/1
 description BRANCH-LAN
 ip address 10.70.4.1 255.255.255.0
 no shutdown
!
interface Loopback0
 description MGMT-LOOPBACK
 ip address 198.51.100.7 255.255.255.255
!
ip access-list extended BRANCH-IN
 remark management access from the NOC range only
 permit tcp 198.51.100.0 0.0.0.255 any eq 22
 remark permit established return traffic
 permit tcp any any established
 deny   ip any any log
!
line con 0
 exec-timeout 10 0
 logging synchronous
line vty 0 15
 exec-timeout 10 0
 transport input ssh
 login authentication default
!
end
