! =============================================================================
! NIRIKSHAK sample corpus -- seed_examples/cisco_ios/edge-rtr-01.cfg
!
! Vendor      : Cisco
! OS family   : IOS (classic, indent-based hierarchy)
! Provenance  : Command syntax adapted from Cisco's own SSH/AAA/SNMPv3 and
!               hardening configuration guides plus community configuration
!               examples. Hostnames, addressing and the overall device
!               identity below are synthetic; only command *syntax* is
!               modelled on real Cisco documentation. See corpus/PROVENANCE.md
!               for the full source list, per docs/CONTENT_POLICY.md.
! Intent      : A deliberately UNDER-hardened device -- most canonical checks
!               here should evaluate to FAIL, to give the pipeline a true
!               "bad device" fixture. See PROVENANCE.md for the specific
!               fields/anti-patterns this file is designed to exercise.
! Secrets     : All hash-shaped and key-shaped values below are fabricated
!               placeholders invented for this corpus. None are real,
!               working, or derived from any real device or organisation.
! =============================================================================
!
version 15.2
service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption
!
hostname edge-rtr-01
!
boot-start-marker
boot-end-marker
!
enable secret 9 $9$SAMPLE$PlaceholderEnableHashNotARealSecretForCorpusUseOnly00112233
!
aaa new-model
aaa authentication login default local
aaa authorization exec default local
!
ip domain-name lab.example.net
!
username netadmin privilege 15 secret 9 $9$SAMPLE$PlaceholderUserHashNotARealSecretForCorpusUseOnly44556677
!
ip ssh version 1
ip ssh time-out 120
ip ssh authentication-retries 3
ip ssh server algorithm encryption 3des-cbc aes128-cbc
ip ssh server algorithm mac hmac-md5 hmac-sha1
!
ip http server
ip http secure-server
!
no logging console
logging buffered 16384
logging host 192.0.2.50
logging trap informational
!
ntp server 192.0.2.10
ntp server 192.0.2.11
!
snmp-server community public RO
snmp-server community private RW
snmp-server location DC1-ROW4-RACK12
snmp-server contact netops@example.net
!
banner motd ^C
******************************************************************
  Authorised access only. All activity may be monitored and logged.
******************************************************************
^C
!
interface GigabitEthernet0/0
 description WAN-UPLINK-TO-ISP
 ip address 203.0.113.2 255.255.255.252
 no shutdown
!
interface GigabitEthernet0/1
 description LAN-CORE
 ip address 10.10.0.1 255.255.255.0
 no shutdown
!
interface Loopback0
 description MGMT-LOOPBACK
 ip address 198.51.100.1 255.255.255.255
!
ip access-list extended EDGE-IN
 remark permit established return traffic
 permit tcp any any established
 remark allow web traffic regardless of source -- overly permissive
 permit tcp any any eq 443
 permit tcp any any eq 80
 remark catch-all -- makes every rule below it irrelevant
 permit ip any any
 remark unreachable: the catch-all permit ABOVE already matches this traffic.
 remark a rule below cannot shadow a rule above -- ACLs evaluate top-down.
 deny   tcp 198.51.100.0 0.0.0.255 any eq 22
 remark redundant with the established rule at the top; never evaluated
 permit tcp any any established
 deny   ip any any log
!
line con 0
 exec-timeout 0 0
 logging synchronous
line vty 0 4
 exec-timeout 60 0
 transport input telnet ssh
 login authentication default
line vty 5 15
 exec-timeout 60 0
 transport input telnet ssh
 login authentication default
!
end
