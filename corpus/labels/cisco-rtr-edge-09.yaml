fields:
  - field: ssh_version
    determinability: determinable
    expected_value: 2
    evidence_line: 8
    evidence_text: ip ssh version 2
    rationale: The version is stated explicitly.

  - field: telnet_enabled
    determinability: determinable
    expected_value: false
    evidence_line: 20
    evidence_text: " transport input ssh"
    rationale: >-
      The vty lines accept ssh only. Telnet is not among the permitted
      transports, so it is not accepted for management access.

  - field: http_server_enabled
    determinability: determinable
    expected_value: false
    evidence_line: 9
    evidence_text: no ip http server
    rationale: The plaintext HTTP server is explicitly disabled.

  - field: https_server_enabled
    determinability: determinable
    expected_value: false
    evidence_line: 10
    evidence_text: no ip http secure-server
    rationale: The TLS management server is explicitly disabled.

  - field: idle_timeout_seconds
    determinability: determinable
    expected_value: 300
    evidence_line: 21
    evidence_text: " exec-timeout 5 0"
    rationale: >-
      Five minutes and zero seconds under line vty 0 4, so 300 seconds. The
      console timeout is a different control and this file configures none.

  - field: logging_hosts
    determinability: determinable
    expected_value: ["192.0.2.11"]
    evidence_line: 12
    evidence_text: logging host 192.0.2.11
    rationale: One remote logging destination is configured.

  - field: ntp_servers
    determinability: determinable
    expected_value: ["192.0.2.22"]
    evidence_line: 13
    evidence_text: ntp server 192.0.2.22
    rationale: One time source is configured.

  - field: banner_present
    determinability: determinable
    expected_value: false
    evidence_line: null
    evidence_text: null
    rationale: >-
      The file contains no banner directive of any kind. A banner exists only by
      being configured, so its absence establishes the value.

  - field: logging_enabled
    determinability: not_determinable
    rationale: >-
      A logging destination is configured, but the file does not state whether
      the logging subsystem itself is enabled. Reading one from the other is an
      inference, not a reading.

  - field: aaa_enabled
    determinability: not_determinable
    rationale: >-
      No aaa directive appears. Whether authentication is centralised when
      unconfigured is documented platform behaviour, not a property of this file.

  - field: min_password_length
    determinability: not_determinable
    rationale: No password policy directive appears; the default is platform behaviour.

  - field: snmp_v3_only
    determinability: not_determinable
    rationale: No snmp-server directive appears. The file says nothing about SNMP.

  - field: weak_ciphers
    determinability: not_determinable
    rationale: >-
      No cipher or algorithm directive appears. Which suites an unconfigured
      device offers is documented platform behaviour.

