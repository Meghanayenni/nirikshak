rule_id: NRK-HTTP-001
title: Plaintext HTTP management server disabled
severity: high
rationale: >-
  The unencrypted HTTP management server exposes administrative credentials and
  session state to anyone on the path. A device that needs web management should
  offer it over TLS only; a device that does not need it should not run the
  server at all. This check covers the plaintext listener specifically, and takes
  no position on whether web management is used.
check:
  field: http_server_enabled
  condition: { op: is_false }
frameworks:
  - framework: nist
    control_id: "CM-07"
    version: "5.2.0"
    citation: "NIST SP 800-53 Rev 5 — OSCAL catalog, edition 5.2.0, control CM-07"
    # Our judgement that this check evidences this control, not a
    # published crosswalk. No catalog maps NIRIKSHAK's own rules.
    mapping_provenance: project_asserted
  - framework: nist
    control_id: "AC-17(02)"
    version: "5.2.0"
    citation: "NIST SP 800-53 Rev 5 — OSCAL catalog, edition 5.2.0, control AC-17(02)"
    # Our judgement that this check evidences this control, not a
    # published crosswalk. No catalog maps NIRIKSHAK's own rules.
    mapping_provenance: project_asserted
