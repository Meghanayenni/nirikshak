rule_id: NRK-HTTP-001
title: Plaintext HTTP management server disabled
severity: high
rationale: >-
  The unencrypted HTTP management server exposes administrative credentials and
  session state to anyone on the path. A device that needs web management should
  offer it over TLS only; a device that does not need it should not run the
  server at all. This check covers the plaintext listener specifically, and takes
  no position on whether web management is used.
check:
  field: http_server_enabled
  condition: { op: is_false }
frameworks:
  - framework: nist
    control_id: "CM-07"
    version: "5.2.0"
    citation: "NIST SP 800-53 Rev 5 — OSCAL catalog, edition 5.2.0, control CM-07"
    # Our judgement that this check evidences this control, not a
    # published crosswalk. No catalog maps NIRIKSHAK's own rules.
    mapping_provenance: project_asserted
  - framework: nist
    control_id: "AC-17(02)"
    version: "5.2.0"
    citation: "NIST SP 800-53 Rev 5 — OSCAL catalog, edition 5.2.0, control AC-17(02)"
    # Our judgement that this check evidences this control, not a
    # published crosswalk. No catalog maps NIRIKSHAK's own rules.
    mapping_provenance: project_asserted
  - framework: stig
    control_id: "CISC-ND-000470"
    version: "V3R7 (2026-04-01)"
    citation: "DISA Cisco IOS XE Router NDM STIG — XCCDF manual benchmark, edition V3R7 (2026-04-01), control CISC-ND-000470"
    # `ip http server` is on the control's list of commands that must not be
    # configured. The other services on that list are not read (ADR 0052).
    mapping_provenance: project_asserted
not_mapped:
  - framework: cis
    reason: >-
      CIS Cisco IOS XE 17.x v2.2.1 has no recommendation requiring the plaintext
      HTTP server be disabled. Its three HTTP recommendations (1.1.5, 1.2.9, 1.2.10) all
      constrain a server assumed to be running. DISA's CISC-ND-000470 says the opposite,
      and the two sourced frameworks are recorded as disagreeing rather than reconciled
      (ADR 0052).
