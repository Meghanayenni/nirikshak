rule_id: NRK-TIMEOUT-001
title: Management sessions time out within ten minutes
severity: medium
rationale: >-
  An idle administrative session left open on an unattended terminal is a working
  authenticated session for whoever reaches it next. Ten minutes (600 seconds) is
  NIRIKSHAK's own operational default, chosen as a balance between that exposure
  and interrupting legitimate work; it is data, and an operator with a different
  policy edits it. A timeout of zero means the session never expires and is
  therefore the worst case, not the best — so the check is bounded at both ends.
  Until DEF-8 was fixed this rule asked only for 'at most 600', which zero
  satisfies numerically, and the least secure setting the platform offers was
  reported as compliant.
check:
  field: idle_timeout_seconds
  all_of:
    - { op: gt,  value: 0 }
    - { op: lte, value: 600 }
frameworks:
  - framework: nist
    control_id: "AC-12"
    version: "5.2.0"
    citation: "NIST SP 800-53 Rev 5 — OSCAL catalog, edition 5.2.0, control AC-12"
    # Our judgement that this check evidences this control, not a
    # published crosswalk. No catalog maps NIRIKSHAK's own rules.
    mapping_provenance: project_asserted
  - framework: nist
    control_id: "SC-10"
    version: "5.2.0"
    citation: "NIST SP 800-53 Rev 5 — OSCAL catalog, edition 5.2.0, control SC-10"
    # Our judgement that this check evidences this control, not a
    # published crosswalk. No catalog maps NIRIKSHAK's own rules.
    mapping_provenance: project_asserted
  - framework: cis
    control_id: "1.2.8"
    version: "v2.2.1 (2025-07-17)"
    citation: "CIS Cisco IOS XE 17.x Benchmark, edition v2.2.1 (2025-07-17), control 1.2.8"
    # At most ten minutes on vty, which is exactly this rule's upper bound.
    mapping_provenance: project_asserted
not_mapped:
  - framework: stig
    reason: >-
      CISC-ND-000720 requires five minutes or less; this rule passes up to ten.
      Mapping it would print a STIG identifier beside a PASS the STIG calls a finding,
      for any timeout from 301 to 600 seconds (ADR 0052).
