rule_id: NRK-BANNER-001
title: Login banner present
severity: low
rationale: >-
  A banner shown before authentication is the device's notice that access is
  restricted and monitored. Its value is procedural rather than technical: it
  removes an "I did not know this was private" defence and is commonly required
  by organisational policy. It prevents no attack, which is why severity is low.
  NIRIKSHAK checks that a banner exists and does not evaluate its wording.
check:
  field: banner_present
  condition: { op: is_true }
frameworks:
  - framework: nist
    control_id: "AC-08"
    version: "5.2.0"
    citation: "NIST SP 800-53 Rev 5 — OSCAL catalog, edition 5.2.0, control AC-08"
    # Our judgement that this check evidences this control, not a
    # published crosswalk. No catalog maps NIRIKSHAK's own rules.
    mapping_provenance: project_asserted
  - framework: cis
    control_id: "1.3.3"
    version: "v2.2.1 (2025-07-17)"
    citation: "CIS Cisco IOS XE 17.x Benchmark, edition v2.2.1 (2025-07-17), control 1.3.3"
    # The Cisco pack reads `banner motd`, which is this recommendation's directive.
    # 1.3.2 (`banner login`) is a different directive and is not mapped (ADR 0052).
    mapping_provenance: project_asserted
not_mapped:
  - framework: stig
    reason: >-
      CISC-ND-000160 requires `banner login` carrying the mandated DoD notice
      text. This rule reads `banner motd` and checks presence only, so it passes devices
      the STIG calls a finding (ADR 0052).
