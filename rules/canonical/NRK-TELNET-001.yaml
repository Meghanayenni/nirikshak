rule_id: NRK-TELNET-001
title: Telnet not accepted for management access
severity: critical
rationale: >-
  Telnet carries credentials and session content in plaintext, so anyone able to
  observe the management path can read both. Severity is critical rather than
  high because the exposure is not conditional on any further weakness: the
  protocol offers no confidentiality at all, and a single captured session yields
  working credentials.
check:
  field: telnet_enabled
  condition: { op: is_false }
frameworks:
  - framework: nist
    control_id: "CM-07"
    version: "5.2.0"
    citation: "NIST SP 800-53 Rev 5 — OSCAL catalog, edition 5.2.0, control CM-07"
    # Our judgement that this check evidences this control, not a
    # published crosswalk. No catalog maps NIRIKSHAK's own rules.
    mapping_provenance: project_asserted
  - framework: nist
    control_id: "AC-17(02)"
    version: "5.2.0"
    citation: "NIST SP 800-53 Rev 5 — OSCAL catalog, edition 5.2.0, control AC-17(02)"
    # Our judgement that this check evidences this control, not a
    # published crosswalk. No catalog maps NIRIKSHAK's own rules.
    mapping_provenance: project_asserted
  - framework: stig
    control_id: "CISC-ND-000140"
    version: "V3R7 (2026-04-01)"
    citation: "DISA Cisco IOS XE Router NDM STIG — XCCDF manual benchmark, edition V3R7 (2026-04-01), control CISC-ND-000140"
    # Check and fix configure `transport input ssh` on vty. The control's
    # primary ask, an inbound access-class, is not read by this rule (ADR 0052).
    mapping_provenance: project_asserted
  - framework: cis
    control_id: "1.2.2"
    version: "v2.2.1 (2025-07-17)"
    citation: "CIS Cisco IOS XE 17.x Benchmark, edition v2.2.1 (2025-07-17), control 1.2.2"
    # Same directive. The pack reads only `ssh` and `none` as telnet-free, so
    # nothing this rule passes admits another transport (ADR 0052).
    mapping_provenance: project_asserted
