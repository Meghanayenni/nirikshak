rule_id: NRK-TELNET-001
title: Telnet not accepted for management access
severity: critical
rationale: >-
  Telnet carries credentials and session content in plaintext, so anyone able to
  observe the management path can read both. Severity is critical rather than
  high because the exposure is not conditional on any further weakness: the
  protocol offers no confidentiality at all, and a single captured session yields
  working credentials.
check:
  field: telnet_enabled
  condition: { op: is_false }
frameworks:
  - framework: nist
    control_id: "CM-07"
    version: "5.2.0"
    citation: "NIST SP 800-53 Rev 5 — OSCAL catalog, edition 5.2.0, control CM-07"
    # Our judgement that this check evidences this control, not a
    # published crosswalk. No catalog maps NIRIKSHAK's own rules.
    mapping_provenance: project_asserted
  - framework: nist
    control_id: "AC-17(02)"
    version: "5.2.0"
    citation: "NIST SP 800-53 Rev 5 — OSCAL catalog, edition 5.2.0, control AC-17(02)"
    # Our judgement that this check evidences this control, not a
    # published crosswalk. No catalog maps NIRIKSHAK's own rules.
    mapping_provenance: project_asserted
