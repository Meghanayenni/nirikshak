# Thresholds here are NIRIKSHAK's own position, not a benchmark's (see README).
rule_id: NRK-SSH-001
title: SSH protocol version 2 only
severity: high
rationale: >-
  SSH protocol version 1 has known cryptographic weaknesses in its integrity
  checking and key exchange, and a device configured to accept it can be
  downgraded to it. Requiring version 2 explicitly is checkable from the
  configuration, which a statement about which versions are compiled in is not.
check:
  field: ssh_version
  condition: { op: equals, value: 2 }
frameworks:
  - framework: nist
    control_id: "AC-17(02)"
    version: "5.2.0"
    citation: "NIST SP 800-53 Rev 5 — OSCAL catalog, edition 5.2.0, control AC-17(02)"
    # Our judgement that this check evidences this control, not a
    # published crosswalk. No catalog maps NIRIKSHAK's own rules.
    mapping_provenance: project_asserted
  - framework: stig
    control_id: "CISC-ND-001210"
    version: "V3R7 (2026-04-01)"
    citation: "DISA Cisco IOS XE Router NDM STIG — XCCDF manual benchmark, edition V3R7 (2026-04-01), control CISC-ND-001210"
    # The check names `ip ssh version 2` as the compliant form. The control also
    # requires FIPS-approved ciphers, which this rule does not read (ADR 0052).
    mapping_provenance: project_asserted
  - framework: stig
    control_id: "CISC-ND-001200"
    version: "V3R7 (2026-04-01)"
    citation: "DISA Cisco IOS XE Router NDM STIG — XCCDF manual benchmark, edition V3R7 (2026-04-01), control CISC-ND-001200"
    # The check names `ip ssh version 2` exactly as CISC-ND-001210 does; SSHv1
    # carries no HMAC at all. The MAC algorithm list is not read (ADR 0052).
    mapping_provenance: project_asserted
  - framework: cis
    control_id: "2.1.1.2"
    version: "v2.2.1 (2025-07-17)"
    citation: "CIS Cisco IOS XE 17.x Benchmark, edition v2.2.1 (2025-07-17), control 2.1.1.2"
    # Same directive, same value. Recommendation number only; no CIS text is held.
    mapping_provenance: project_asserted
