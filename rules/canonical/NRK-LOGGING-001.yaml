rule_id: NRK-LOGGING-001
title: At least one remote logging destination configured
severity: medium
rationale: >-
  Logs held only on the device are lost when the device is reset, replaced, or
  compromised by someone with enough access to clear them. A remote destination
  is what makes the log evidence rather than a convenience. This checks that a
  destination exists; whether it is reachable is not something a configuration
  file can establish.
check:
  field: logging_hosts
  condition: { op: non_empty }
frameworks:
  - framework: nist
    control_id: "AU-04(01)"
    version: "5.2.0"
    citation: "NIST SP 800-53 Rev 5 — OSCAL catalog, edition 5.2.0, control AU-04(01)"
    # Our judgement that this check evidences this control, not a
    # published crosswalk. No catalog maps NIRIKSHAK's own rules.
    mapping_provenance: project_asserted
  - framework: nist
    control_id: "AU-09(02)"
    version: "5.2.0"
    citation: "NIST SP 800-53 Rev 5 — OSCAL catalog, edition 5.2.0, control AU-09(02)"
    # Our judgement that this check evidences this control, not a
    # published crosswalk. No catalog maps NIRIKSHAK's own rules.
    mapping_provenance: project_asserted
