snippet_id: arista-eos-NRK-LOGGING-001
rule_id: NRK-LOGGING-001
vendor: arista
os_family: eos
os_version_range: null

commands:
  - configure
  - logging host <SYSLOG-COLLECTOR-IP>
  - logging trap informational
  - end
  - write memory
rollback:
  - configure
  - no logging host <SYSLOG-COLLECTOR-IP>
  - end
  - write memory
preconditions:
  - The syslog collector's address is known and reachable from this device's management VRF.
  - Substitute <SYSLOG-COLLECTOR-IP> before pasting. The placeholder is deliberate.
verification:
  - show logging
  - show running-config section logging

impact:
  service_affecting: false
  requires_reload: false
  lockout_risk: none
  notes: Adds outbound syslog traffic. No management path is altered.

depends_on: []
order_hint: 400

vetted_by: Meghana Yenni
vetted_at: '2026-09-07T00:00:00Z'
reference: >-
  Arista EOS User Manual, Logging Commands — 'logging host' —
  https://www.arista.com/en/um-eos/eos-section-6-4-logging-commands
